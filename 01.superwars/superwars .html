<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cont{
            border:1px solid transparent;
            height: 200px;
            width: 800px;
            margin: auto;
            display: flex;
            justify-content: space-evenly;
        }
        .super{
            border: 1px solid grey;
            width: 15%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            border-radius: 10px;
            box-shadow: 1px 1px 5px black;
            

        }
        .war{
            border: 1px solid transparent;
            width: 30%;
            text-align: center;
            font-size: 50px;
        }
        img{
            height:90px;
            width:100px;
        }
        .text{
            width:90px;
            border:1px solid transparent;
            text-align: center;
        }
        .number{
            border: 1px solid transparent;
            width: 90px;
            text-align: center;
            font-size: 50px;
        }
    </style>
</head>
<body>
    <div class="cont">
        <div class="super">
            <img src="super-1.png">
            <div class="text">Spiderman</div>
            <div class="number">12</div>
        </div>
        <div class="super">
            <img src="super-3.png">
            <div class="text">Wonder Woman</div>
            <div class="number">30</div>
        </div>
        <div class="war">5 - 0</div>
        <div class="super">
             <img src="super-2.png">
             <div class="text">Captain America</div>
             <div class="number">50</div>
        </div>
        <div class="super">
            <img src="super-4.png">
            <div class="text">Gem Woman</div>
            <div class="number">12</div>
        </div>
    </div>
</body>
</html>
