    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .cont {
            border: 2px solid black;
            width: 750px;
            height:750px;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
        }

        .home {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .homediv {
            width: 66.666%;
            height: 66.666%;
            background-color: white;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: space-between;
        }

        .fcircle {
            width: 100%;
            height: 50%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }

        .circle {
            width: 25%;
            height:50%;
            border: 3px solid black;
            border-radius: 50%;
        }

        .miniv {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(6, 1fr);
        }

        .minih {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }

        .hsmallbox {
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hsmallbox svg {
            width: 70%;
            height: 70%;
        }

        .center {
            border: 1px solid black;
            display: grid;
        }

        .triangle {
            grid-area: 1 / 1;
            width: 100%;
            height: 100%;
        }

        .triangle.top {
            background-color: green;
            clip-path: polygon(0 0, 100% 0, 50% 50%);
        }

        .triangle.right {
            background-color: yellow;
            clip-path: polygon(100% 0, 100% 100%, 50% 50%);
        }

        .triangle.bottom {
            background-color: blue;
            clip-path: polygon(100% 100%, 0 100%, 50% 50%);
        }

        .triangle.left {
            background-color: red;
            clip-path: polygon(0 100%, 0 0, 50% 50%);
        }


        .cont > .home:nth-child(1) {
            grid-area: 1 / 1 / 7 / 7;
        }


        .cont > .miniv:nth-child(2) {
            grid-area: 1 / 7 / 7 / 10;
        }


        .cont > .home:nth-child(3) {
            grid-area: 1 / 10 / 7 / 16;
        }

        
        .cont > .minih:nth-child(4) {
            grid-area: 7 / 1 / 10 / 7;
        }

        .cont > .center:nth-child(5) {
            grid-area: 7 / 7 / 10 / 10;
        }

        .cont > .minih:nth-child(6) {
            grid-area: 7 / 10 / 10 / 16;
        }

        .cont > .home:nth-child(7) {
            grid-area: 10 / 1 / 16 / 7;
        }

        .cont > .miniv:nth-child(8) {
            grid-area: 10 / 7 / 16 / 10;
        }

        .cont > .home:nth-child(9) {
            grid-area: 10 / 10 / 16 / 16;
        }

    </style>
</head>
