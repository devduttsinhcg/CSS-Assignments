<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cont {
            margin: 0 auto;
            border: 2px solid transparent;
            margin-top: 100px;
            height: 600px;
            width: 1000px;
            background-image: url("https://img.magnific.com/premium-photo/icc-world-cup-cricket-stadium-background-with-flag-trophy-vector-wallpaper-design-illustration_837518-24426.jpg");
            background-size: 100%;

        }

        .super {
            border: 3px solid transparent;
            width: inherit;
            height: 100px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .text {
            border: 1px solid transparent;
            height: 80px;
            width: 200px;
            display: flex;

        }
        .logo{
            border:1px solid transparent;
            width:70px;
            height: inherit;
            display:flex;
            justify-content: center;
            align-items: center;
        }
        .over{
            border:1px solid transparent;
            width:130px;
            height: inherit;
            font-size:35px;
            font-family: sans-serif;
            font-weight: 700;
            text-align: center;
            color: white;
            font-style:italic ;
        }
        .score {
            border: 3px solid transparent;
            width: inherit;
            height: 350px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }

        .india {
            border: 1px solid transparent;
            width: 300px;
            height: 260px;
            border-radius: 20px;
            background-color: blue;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
        }

        .pak {
            border: 1px solid transparent;
            width: 300px;
            height: 260px;
            border-radius: 20px;
            background-color: green;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
        }
        .name{
            border: 1px solid transparent;
            width: inherit;
            height:80px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 50px;
            font-family: sans-serif;
            font-weight: 600;
        }
        .round{
            border: 1px solid transparent;
            width: inherit;
            height:80px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        .circle{
            border: 1px solid white;
            border-radius: 50%;
            width:30px;
            height:30px;
            background-color: white;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            font-size: 25px;
            font-family: sans-serif;
            font-weight: 700;

        }
        .number{
            border: 1px solid transparent;
            width: inherit;
            height:80px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 50px;
            font-family: sans-serif;
            font-weight: 700;
        }
        .buttons {
            border: 3px solid transparent;
            width: inherit;
            height: 150px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 100px;
        }

        .bat {
            outline: 1px solid white;
            height: 75px;
            width: 75px;
            border-radius: 20px;
            background-color: purple;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .replay {
            outline: 1px solid white;
            height: 75px;
            width: 75px;
            border-radius: 20px;
            background-color: red;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="cont">
        <div class="super">
            <div class="text">
                <div class="logo">
                    <img src="bat.png" style="height: 120px;">
                </div>
                <div class="over">Super Over</div>
            </div>
        </div>
        <div class="score">
            <div class="india">
                <div class="name">IND</div>
                <div class="round">
                    <div class="circle">4</div>
                    <div class="circle">3</div>
                    <div class="circle">2</div>
                    <div class="circle">6</div>
                    <div class="circle">6</div>
                    <div class="circle">6</div>
                </div>
                <div class="number">27 / 0</div>
            </div>
            <div class="pak">
                <div class="name">PAK</div>
                <div class="round">
                    <div class="circle">2</div>
                    <div class="circle">4</div>
                    <div class="circle">0</div>
                    <div class="circle">3</div>
                    <div class="circle">1</div>
                    <div class="circle">4</div>
                </div>
                <div class="number">14 / 0</div>
            </div>
        </div>

            </div>
        </div>
    </div>

</body>

</html>
